name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: stylua + luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

      - uses: leafo/gh-actions-lua@v13
        with:
          # luacheck 1.2.0 fails to load under Lua 5.5 (gh-actions-lua's
          # default): "attempt to assign to const variable 'field_name'" in
          # luacheck/standards.lua. 5.1 also matches this repo's own
          # .luacheckrc (std = "lua51").
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: luacheck lua TESTS

  test:
    name: plenary tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: sandbox.nvim

      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b

      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: ui.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Run plenary test suite
        working-directory: sandbox.nvim
        env:
          PLENARY_PATH: ${{ github.workspace }}/plenary.nvim
          LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
          UI_NVIM_PATH: ${{ github.workspace }}/ui.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless --noplugin -u TESTS/minimal_init.lua \
            -c "PlenaryBustedDirectory TESTS/sandbox { minimal_init = 'TESTS/minimal_init.lua', sequential = true }"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
