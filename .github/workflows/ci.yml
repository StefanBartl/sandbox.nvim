name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: stylua + luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

      - uses: leafo/gh-actions-lua@v13
        with:
          # luacheck 1.2.0 fails to load under Lua 5.5 (gh-actions-lua's
          # default): "attempt to assign to const variable 'field_name'" in
          # luacheck/standards.lua. 5.1 also matches this repo's own
          # .luacheckrc (std = "lua51").
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: luacheck lua TESTS

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: sandbox.nvim

      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: ui.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "StefanBartl/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run test suite (testing.nvim)
        working-directory: sandbox.nvim
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/lib.nvim
          UI_NVIM_DIR: ${{ github.workspace }}/ui.nvim
          TESTING_NVIM_DIR: ${{ github.workspace }}/testing.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
