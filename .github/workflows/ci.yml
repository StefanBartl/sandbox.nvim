name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          # luacheck 1.2.0 fails to load under Lua 5.5 (gh-actions-lua's
          # default): "attempt to assign to const variable 'field_name'" in
          # luacheck/standards.lua. 5.1 also matches this repo's own
          # .luacheckrc (std = "lua51").
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck lua tests

  test:
    name: plenary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sandbox.nvim

      - uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim

      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Run plenary test suite
        working-directory: sandbox.nvim
        env:
          PLENARY_PATH: ${{ github.workspace }}/plenary.nvim
          LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/sandbox { minimal_init = 'tests/minimal_init.lua', sequential = true }"
